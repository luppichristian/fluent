name: Generate JUMP index

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate index
        if: github.event_name == 'push'
        run: python3 .github/workflows/gen_jump_file.py
      - name: Check index
        if: github.event_name == 'pull_request'
        run: python3 .github/workflows/gen_jump_file.py --check
      - name: Commit generated index
        if: github.event_name == 'push'
        run: |
          git diff --quiet -- JUMP.md || {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add JUMP.md
            git commit -m 'chore: update JUMP index'
            git push
          }
